name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Native shell command to dump all secrets safely into a .env file
      - name: Generate .env File
        run: |
          echo "${{ secrets.VITE_GEMINI_API_KEY && format('VITE_GEMINI_API_KEY={0}', secrets.VITE_GEMINI_API_KEY) }}" >> .env
          echo "${{ secrets.STREAM_API_KEY && format('STREAM_API_KEY={0}', secrets.STREAM_API_KEY) }}" >> .env
          echo "${{ secrets.STREAM_API_SECRET && format('STREAM_API_SECRET={0}', secrets.STREAM_API_SECRET) }}" >> .env

      - name: Build React App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Use './build' if using Create React App

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
